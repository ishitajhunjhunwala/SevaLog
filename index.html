<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A lightweight family caregiving log for recording daily updates and sharing WhatsApp digests."
    />
    <title>SevaLog Care Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-labelledby="app-title">
        <header class="topbar">
          <div class="brand">
            <div class="mark" aria-hidden="true">
              <svg viewBox="0 0 32 32" role="img">
                <path d="M16 4c4.1 3.3 8.2 3.8 11 4.1v7.3c0 6.2-4 10.4-11 12.6C9 25.8 5 21.6 5 15.4V8.1C7.8 7.8 11.9 7.3 16 4Z" />
                <path d="M11 16h10M16 11v10" />
              </svg>
            </div>
            <div>
              <p class="eyebrow">Family care log</p>
              <h1 id="app-title">SevaLog</h1>
            </div>
          </div>
          <button class="ghost-button" id="install-sample" type="button">Load demo</button>
        </header>

        <section class="grid">
          <aside class="panel setup-panel" aria-labelledby="setup-title">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Care circle</p>
                <h2 id="setup-title">Today at a glance</h2>
              </div>
              <span class="status-pill" id="sync-status">Saved on this phone</span>
            </div>

            <form class="profile-form" id="profile-form">
              <label>
                Elder name
                <input id="elder-name" name="elderName" autocomplete="off" placeholder="Amma" />
              </label>
              <label>
                Caregiver
                <input id="caregiver-name" name="caregiverName" autocomplete="off" placeholder="Meera" />
              </label>
              <button class="primary-button" type="submit">Save care circle</button>
            </form>

            <div class="stats" aria-label="Today summary">
              <div>
                <span id="today-count">0</span>
                <p>updates today</p>
              </div>
              <div>
                <span id="med-count">0</span>
                <p>medicine logs</p>
              </div>
              <div>
                <span id="last-log">No logs yet</span>
                <p>last update</p>
              </div>
            </div>
          </aside>

          <section class="panel log-panel" aria-labelledby="quick-title">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Quick log</p>
                <h2 id="quick-title">Record what happened</h2>
              </div>
              <button class="secondary-button" id="clear-form" type="button">Clear</button>
            </div>

            <div class="quick-actions" id="quick-actions" aria-label="Quick care updates"></div>

            <form class="entry-form" id="entry-form">
              <div class="split">
                <label>
                  Type
                  <select id="entry-type" name="type">
                    <option value="medicine">Medicine</option>
                    <option value="meal">Meal</option>
                    <option value="vitals">Vitals</option>
                    <option value="appointment">Appointment</option>
                    <option value="note">Note</option>
                  </select>
                </label>
                <label>
                  Time
                  <input id="entry-time" name="time" type="time" />
                </label>
              </div>

              <label>
                Update
                <input id="entry-title" name="title" autocomplete="off" placeholder="Gave BP tablet" required />
              </label>

              <label>
                Details
                <textarea
                  id="entry-note"
                  name="note"
                  rows="3"
                  placeholder="Dose, reading, doctor name, food notes, or anything family should know"
                ></textarea>
              </label>

              <button class="primary-button wide" type="submit">Add to timeline</button>
            </form>
          </section>
        </section>

        <section class="panel timeline-panel" aria-labelledby="timeline-title">
          <div class="panel-heading stacked">
            <div>
              <p class="eyebrow">Family visibility</p>
              <h2 id="timeline-title">Care timeline</h2>
            </div>
            <div class="toolbar" role="toolbar" aria-label="Timeline actions">
              <select id="filter-type" aria-label="Filter timeline">
                <option value="all">All updates</option>
                <option value="medicine">Medicine</option>
                <option value="meal">Meal</option>
                <option value="vitals">Vitals</option>
                <option value="appointment">Appointments</option>
                <option value="note">Notes</option>
              </select>
              <button class="secondary-button" id="copy-digest" type="button">Copy digest</button>
              <button class="primary-button" id="share-whatsapp" type="button">Share on WhatsApp</button>
            </div>
          </div>

          <div class="digest-preview" id="digest-preview" aria-live="polite"></div>
          <ol class="timeline" id="timeline" aria-live="polite"></ol>
        </section>

        <section class="utility-row" aria-label="Data utilities">
          <button class="ghost-button" id="export-data" type="button">Export backup</button>
          <label class="file-button">
            Import backup
            <input id="import-data" type="file" accept="application/json" />
          </label>
          <button class="danger-button" id="reset-data" type="button">Reset device data</button>
        </section>
      </section>
    </main>

    <template id="timeline-empty">
      <li class="empty-state">
        <h3>No care updates yet</h3>
        <p>Add the first update above. The WhatsApp digest will build itself from today's entries.</p>
      </li>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
